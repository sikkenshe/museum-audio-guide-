<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
text { font-family: Arial, sans-serif; font-size: 18px; }
.title { font-size: 22px; font-weight: bold; }
.small { font-size: 15px; }
.box { fill: white; stroke: black; stroke-width: 2; }
.iface { fill: #f4f4f4; stroke: black; stroke-width: 2; }
line, path { stroke: black; stroke-width: 2; fill: none; }
</style>

<text x="600" y="35" text-anchor="middle" class="title">Museum Audio Guide — Bridge + Adapter</text>

<!-- Abstraction side -->
<rect x="70" y="90" width="300" height="90" class="box"/>
<text x="220" y="120" text-anchor="middle" class="small">&lt;&lt;abstract&gt;&gt;</text>
<text x="220" y="150" text-anchor="middle">AudioGuide</text>
<text x="220" y="172" text-anchor="middle" class="small">- audioPlayer: AudioPlayer</text>

<rect x="20" y="270" width="250" height="70" class="box"/>
<text x="145" y="312" text-anchor="middle">StandardTourGuide</text>

<rect x="300" y="270" width="250" height="70" class="box"/>
<text x="425" y="312" text-anchor="middle">InteractiveTourGuide</text>

<line x1="145" y1="270" x2="220" y2="180"/>
<line x1="425" y1="270" x2="220" y2="180"/>

<!-- Implementor -->
<rect x="720" y="90" width="300" height="90" class="iface"/>
<text x="870" y="120" text-anchor="middle" class="small">&lt;&lt;interface&gt;&gt;</text>
<text x="870" y="150" text-anchor="middle">AudioPlayer</text>
<text x="870" y="172" text-anchor="middle" class="small">+ play(AudioTrack)</text>

<line x1="370" y1="135" x2="720" y2="135"/>
<text x="545" y="125" text-anchor="middle" class="small">Bridge</text>

<rect x="600" y="270" width="210" height="70" class="box"/>
<text x="705" y="312" text-anchor="middle">LocalAudioPlayer</text>

<rect x="840" y="270" width="230" height="70" class="box"/>
<text x="955" y="312" text-anchor="middle">StreamingAudioPlayer</text>

<rect x="720" y="420" width="300" height="80" class="box"/>
<text x="870" y="452" text-anchor="middle">LegacyPlayerAdapter</text>
<text x="870" y="478" text-anchor="middle" class="small">wraps LegacyMuseumPlayer</text>

<line x1="705" y1="270" x2="850" y2="180"/>
<line x1="955" y1="270" x2="890" y2="180"/>
<line x1="870" y1="420" x2="870" y2="180"/>

<!-- Adaptee -->
<rect x="720" y="590" width="300" height="90" class="box"/>
<text x="870" y="625" text-anchor="middle">LegacyMuseumPlayer</text>
<text x="870" y="653" text-anchor="middle" class="small">+ startLegacyTrack(...): int</text>

<line x1="870" y1="500" x2="870" y2="590"/>
<text x="940" y="555" class="small">Adapter wraps</text>

<!-- Resolver -->
<rect x="70" y="470" width="300" height="85" class="box"/>
<text x="220" y="505" text-anchor="middle">AudioPlayerResolver</text>
<text x="220" y="532" text-anchor="middle" class="small">runtime selection</text>

<rect x="70" y="620" width="300" height="70" class="iface"/>
<text x="220" y="650" text-anchor="middle" class="small">&lt;&lt;interface&gt;&gt;</text>
<text x="220" y="675" text-anchor="middle">AudioPlayerProvider</text>

<line x1="220" y1="555" x2="220" y2="620"/>
<text x="235" y="590" class="small">uses</text>
</svg>